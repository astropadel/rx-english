<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rx English">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F1">
<title>Rx English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ground:#EDF0F1;--paper:#fff;--ink:#111C24;--muted:#5B6972;--line:#D8DEE1;
--pri:#111C24;--pri-d:#0A1218;--pri-l:#E7E9EA;--pri-b:#AEB9BF;
--ok:#1F8A5B;--ok-bg:#E2F2EA;--ok-ink:#17613F;--bad:#C2453D;--bad-bg:#FAE7E5;--bad-ink:#8D2B25;
--sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--text:'Newsreader',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{overflow-x:clip}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ic{display:block;flex:none}
.ic.fill{fill:currentColor}
.wrap{max-width:540px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
#splash{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;place-items:center;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp{display:flex;flex-direction:column;align-items:center}
#splash .sm{width:80px;height:80px;border-radius:25px;background:#fff;display:grid;place-items:center;animation:pop .7s cubic-bezier(.2,1.3,.4,1) both}
#splash .sm svg{width:42px;height:42px;animation:tilt 1s cubic-bezier(.3,.7,.2,1) .1s both}
#splash .sm svg *{stroke:var(--ink)!important}
#splash b{color:#fff;font-size:30px;font-weight:800;letter-spacing:-.045em;margin-top:20px;animation:rise .6s ease .45s both}
#splash b span{color:#9AA7AF;font-weight:600}
#splash .tag{margin-top:10px;color:#C7D0D5;font-size:16px;font-weight:600;letter-spacing:-.01em;animation:rise .6s ease .75s both}
#splash .ln{width:0;height:3px;border-radius:3px;background:#fff;margin-top:26px;animation:ln 1.1s cubic-bezier(.4,0,.2,1) .2s both}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes tilt{from{transform:rotate(-120deg) scale(.7)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ln{from{width:0}to{width:120px}}
@media (prefers-reduced-motion:reduce){#splash .sm,#splash .sm svg,#splash b,#splash .tag,#splash .ln{animation:none}#splash .ln{width:120px}}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app>.wrap{flex:1 0 auto;width:100%}
/* header */
.top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);background:rgba(237,240,241,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:4px;height:60px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:34px;height:34px;border-radius:11px;background:var(--ink);display:grid;place-items:center;flex:none}
.wm{font-weight:800;font-size:19px;letter-spacing:-.03em}
.wm span{font-weight:500;color:var(--muted)}
.chip{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px;padding:6px 8px;border-radius:12px;font-variant-numeric:tabular-nums}
.chip.fire{color:#C4571C}.chip.xp{color:#9A6B00}
.iconbtn{border:0;background:transparent;padding:8px;border-radius:12px;color:var(--ink);display:grid;place-items:center}
.iconbtn:active{background:#DDE3E6}
/* home */
.hello{margin:26px 2px 20px}
.hello h1{margin:0;font-size:31px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.hello p{margin:7px 0 0;color:var(--muted);font-weight:500;font-size:15px;line-height:1.4}
.dose{margin:0 0 18px}
.dose .lbl{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:9px}
.dose .lbl small{color:var(--muted);font-weight:500;font-size:13px;letter-spacing:0;font-variant-numeric:tabular-nums}
.capsule{position:relative;height:46px;border-radius:23px;border:1.5px solid var(--ink);padding:4px;background:var(--paper);display:flex;overflow:hidden}
.capsule::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1.5px solid var(--ink);opacity:.18;pointer-events:none}
.capsule i{display:block;height:100%;border-radius:19px;background:var(--ink);transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 18px}
.stat{padding:14px 4px 13px}
.stat+.stat{border-left:1px solid var(--line);padding-left:14px}
.stat b{display:flex;align-items:center;gap:6px;font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat b .ic{color:#C4571C}
.stat b small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0;align-self:flex-end;padding-bottom:3px}
.stat span{display:block;margin-top:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.review{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 6px;background:transparent;border:1.5px dashed var(--pri-b);border-radius:18px;padding:14px 16px;text-align:left}
.review[disabled]{opacity:.5;cursor:default}
.rico{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.review b{display:block;font-size:16px;font-weight:700;letter-spacing:-.015em}
.review div span{font-size:13.5px;color:var(--muted);font-weight:500}
.sec{margin:36px 2px 4px;font-size:23px;font-weight:800;letter-spacing:-.035em}
.secnote{margin:0 2px 14px;color:var(--muted);font-size:14px;font-weight:500;line-height:1.4}
/* unit = blister pack */
.unit{border-radius:20px;overflow:hidden;margin-bottom:12px;background:color-mix(in srgb,var(--c) 9%,#fff);border:1px solid color-mix(in srgb,var(--c) 24%,#fff)}
.uhead{display:flex;gap:13px;align-items:center;padding:15px 16px;background:var(--c);color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none}
.utile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.17)}
.utitle{font-weight:700;font-size:17.5px;line-height:1.2;letter-spacing:-.02em}
.usub{font-size:13px;opacity:.86;font-weight:500;margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit:not(.closed) .mini{display:none}
.mini{display:flex;gap:4px;align-items:center;flex:none}
.mini i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.mini i.on{background:#fff;box-shadow:none}
.mini i.cap{width:18px;border-radius:5px}
.chev{flex:none;opacity:.85;transition:transform .2s;display:grid;place-items:center}
.unit.closed .chev{transform:rotate(-90deg)}
.unit.closed .lessons{display:none}
.lessons{display:flex;flex-wrap:wrap;gap:14px 10px;padding:18px 14px}
.lnode{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;padding:0;width:68px;flex:none}
.lnode.pc{width:84px}
.lnode i{font-style:normal;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-.02em;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);box-shadow:inset 0 3px 5px -1px color-mix(in srgb,var(--c) 38%,transparent),0 1px 0 #fff;transition:transform .12s}
.lnode.pc i{width:80px;border-radius:26px}
.lnode.done i{background:var(--c);color:#fff;box-shadow:0 4px 8px -3px color-mix(in srgb,var(--c) 70%,#000),inset 0 1px 0 rgba(255,255,255,.25)}
.lnode.next i{background:#fff;box-shadow:inset 0 0 0 2.5px var(--c),0 0 0 5px color-mix(in srgb,var(--c) 16%,transparent);animation:ring 2.2s infinite}
.lnode.soon i{background:#fff;box-shadow:inset 0 0 0 2.5px var(--c)}
.lnode.lock i{background:linear-gradient(135deg,#E9EDEF,#D5DBDF);color:#8794A0;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.lnode span{font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;max-width:80px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lnode.lock span{opacity:.65}
.lnode:active i{transform:scale(.94)}
.lnode.pop i{animation:take .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes ring{0%,100%{box-shadow:inset 0 0 0 2.5px var(--c),0 0 0 5px color-mix(in srgb,var(--c) 16%,transparent)}50%{box-shadow:inset 0 0 0 2.5px var(--c),0 0 0 9px color-mix(in srgb,var(--c) 0%,transparent)}}
@keyframes take{0%{transform:scale(.7)}100%{transform:scale(1)}}
.nav{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);margin-top:28px;padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex}
.nav button{flex:1;border:0;background:transparent;padding:10px 0 11px;font-weight:600;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button.on{color:var(--ink)}
.welcome{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 0 calc(22px + env(safe-area-inset-bottom))}
.welcome .wrap{flex:1;display:flex;flex-direction:column}
.wbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 2px}
.wmark{width:64px;height:64px;border-radius:20px;background:var(--ink);display:grid;place-items:center;margin-bottom:26px}
.wmark svg{width:34px;height:34px}
.wbody h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1.04}
.wbody h1 span{color:var(--muted);font-weight:600}
.wbody>p{margin:12px 0 0;color:var(--muted);font-weight:500;font-size:17px;line-height:1.45;max-width:30em}
.wfeat{display:flex;flex-direction:column;gap:18px;margin-top:28px}
.wf{display:flex;gap:14px;align-items:flex-start}
.wf .wi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.wf b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.wf span{display:block;color:var(--muted);font-size:14.5px;font-weight:500;line-height:1.4;margin-top:2px}
.wname{width:100%;margin-top:26px;padding:16px 18px;border:1.5px solid var(--line);border-radius:16px;font:inherit;font-weight:700;font-size:20px;letter-spacing:-.02em;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink);outline:none}
.wname:focus{border-color:var(--ink)}
.wdots{display:flex;gap:7px;justify-content:center;margin:0 0 16px}
.wdots i{width:7px;height:7px;border-radius:99px;background:var(--pri-b);transition:width .25s,background .25s}
.wdots i.on{width:22px;background:var(--ink)}
.wacts{display:flex;flex-direction:column;gap:10px}
.nameedit{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px}
.foot-note{display:flex;gap:6px;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12.5px;font-weight:500;margin:10px 0 18px}
/* dictionary */
.searchbox{position:relative;margin:0 0 12px}
.searchbox .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search{width:100%;padding:14px 16px 14px 44px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-weight:600;font-size:16px;background:#fff;outline:none}
.search:focus{border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.fchip .dot{width:9px;height:9px;border-radius:50%}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gcount{font-size:13px;font-weight:500;color:var(--muted);margin:2px 2px 0}
.gunit{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em;margin:28px 2px 6px}
.gtile{width:30px;height:30px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.gsub{font-weight:700;font-size:13px;color:var(--c);margin:16px 2px 2px}
.gitem{padding:12px 2px;border-bottom:1px solid var(--line)}
.grow{display:flex;align-items:center;gap:10px}
.gitem .en{font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.mast{color:var(--ok);display:inline-grid}
.gitem .es{color:var(--muted);font-weight:500;font-size:14.5px;margin-top:1px}
.gitem .ex{display:none;margin-top:10px;padding-left:12px;border-left:2px solid var(--c);font-family:var(--text);font-size:16.5px;line-height:1.5}
.gitem .ex i{display:block;color:var(--muted);font-style:italic;margin-top:3px;font-size:15.5px}
.gitem.open .ex{display:block}
.gnote{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:#8A5200;font-weight:600;margin-top:5px;line-height:1.35}
.gnote .ic{margin-top:1px}
.spk{border:0;background:color-mix(in srgb,var(--c,var(--pri)) 12%,#fff);color:var(--c,var(--pri));border-radius:50%;width:38px;height:38px;flex:none;display:grid;place-items:center}
.seg{display:flex;background:#DDE3E6;border-radius:12px;padding:3px;margin:18px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(17,28,36,.14)}
.flash{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:20px;padding:20px 18px 18px;margin-top:4px;min-height:320px;display:flex;flex-direction:column;cursor:pointer}
.flash:not([data-act]){cursor:default}
.fmeta{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--c)}
.fmeta .gtile{width:26px;height:26px;border-radius:8px}
.fterm{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:28px 0 8px}
.fterm b{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.fhint{color:var(--muted);font-size:14.5px;font-weight:500;line-height:1.4}
.fes{font-size:20px;font-weight:700;color:var(--c);letter-spacing:-.015em;line-height:1.3}
.fex{margin-top:16px;padding-left:12px;border-left:2px solid var(--c);font-family:var(--text);font-size:17px;line-height:1.5}
.fex i{display:block;color:var(--muted);font-style:italic;margin-top:3px;font-size:16px}
.factions{margin-top:auto;padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.factions.one{grid-template-columns:1fr}
.btn.cbtn{background:var(--c)}
.flink{display:block;margin:12px auto 0;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.fcount{font-size:13px;color:var(--muted);font-weight:500;margin:8px 2px 0;text-align:center}
.scenes{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:20px;overflow:hidden}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:14px 16px;text-align:left;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.snum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.srow.done .snum{background:var(--c);color:#fff;box-shadow:none}
.srow.lock .snum{color:#8794A0;box-shadow:inset 0 0 0 1.5px #D5DBDF}
.srow.lock .stext{opacity:.55}
.stext{flex:1;min-width:0}
.stext b{display:block;font-size:16px;font-weight:700;letter-spacing:-.015em}
.stext span{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.sstat{flex:none;color:var(--c);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.stitle{font-weight:800;font-size:21px;letter-spacing:-.03em;margin:2px 0 10px}
.ctx{background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 18%,#fff);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin:0 0 16px}
.thread{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.them{max-width:90%;scroll-margin-top:12px}
.who{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 4px 4px}
.tb{background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:16.5px;line-height:1.45}
.tb i{display:block;margin-top:8px;color:var(--muted);font-family:var(--text);font-style:italic;font-size:16px;line-height:1.4}
.tbar{display:flex;align-items:center;gap:12px;margin-top:8px}
.tbar .spk{width:32px;height:32px}
.tr{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:0;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.me{align-self:flex-end;max-width:86%}
.mb{background:var(--c);color:#fff;border-radius:18px 4px 18px 18px;padding:12px 14px;font-size:16px;line-height:1.45}
.opt.meh{border-color:#C98A1B;background:#FFF4DC;color:#7A4A00}
.lfoot.meh{background:#FFF4DC;border-color:#F2DDA8}
.lfoot.meh .fb{display:block}
.lfoot.meh .fb h3{color:#7A4A00}
.btn.meh{background:#B5770F}
.fb .best{margin-top:10px;font-size:15px;font-weight:600;line-height:1.4}
.fb .best span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
.keyp{text-align:left;margin:0 0 26px}
.keyp h4{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.kp{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.4}
.kp span{flex:1}
.kp .spk{width:34px;height:34px}
.endbtns{display:grid;gap:10px}
@media (max-width:389px){.lessons{gap:12px 6px;padding:16px 10px}.lnode{width:60px}.lnode.pc{width:76px}.lnode i{width:48px;height:48px;font-size:18px}.lnode.pc i{width:72px}.lnode span{font-size:11px}.utile{width:38px;height:38px;border-radius:12px}.uhead{gap:10px;padding:14px 12px}.hello h1{font-size:27px}.stat b{font-size:23px}.term b{font-size:24px}.fterm b{font-size:27px}}
@media (max-width:340px){.lessons{gap:12px 4px}.lnode{width:56px}.lnode.pc{width:70px}.lnode i{width:44px;height:44px;font-size:17px}.lnode.pc i{width:66px}.lnode span{font-size:10.5px}}
/* lesson */
.lesson{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.lbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 14px}
.bar{height:8px;background:#DCE2E5;border-radius:99px;overflow:hidden}

020,14580],"Good Distribution Practice":["a11",291600,9540],"Transport must comply with Good Distribution Practice.":["a11",301140,16560],"manufacturing site":["a11",317700,8280],"The manufacturing site is in Ireland.":["a11",325980,11880],"batch release":["a11",337860,5580],"Batch release is done by a qualified person.":["a11",343440,14220],"packaging":["a11",357660,4860],"The packaging includes the patient leaflet.":["a11",362520,12600],"labelling":["a11",375120,4860],"Labelling must be in Spanish.":["a11",379980,11700],"serialization":["a11",391680,5940],"Serialization helps prevent falsified medicines.":["a11",397620,15480],"quality assurance":["a11",413100,7740],"Quality assurance reviewed the deviation.":["a11",420840,12060],"regulatory affairs":["a12",0,8820],"Regulatory affairs prepares the submission.":["a12",8820,14580],"submission":["a12",23400,4860],"The submission was sent to the agency in May.":["a12",28260,12960],"dossier":["a12",41220,4320],"The dossier has five modules.":["a12",45540,10260],"variation":["a12",55800,5760],"We filed a variation to add a new strength.":["a12",61560,13140],"renewal":["a12",74700,4860],"The licence renewal is due next year.":["a12",79560,11520],"marketing authorization holder":["a12",91080,9540],"The marketing authorization holder is responsible for safety.":["a12",100620,16560],"summary of product characteristics":["a12",117180,12600],"Check the summary of product characteristics for the dose.":["a12",129780,16920],"package leaflet":["a12",146700,5940],"The package leaflet must be easy to read.":["a12",152640,13320],"health authority":["a12",165960,5220],"The health authority asked for more data.":["a12",171180,12420],"centralized procedure":["a12",183600,8100],"The drug was approved through the centralized procedure.":["a12",191700,14400],"scientific advice":["a12",206100,7740],"We requested scientific advice before phase III.":["a12",213840,15300],"conditional approval":["a12",229140,7020],"It received conditional approval due to high unmet need.":["a12",236160,16380],"accelerated assessment":["a12",252540,7560],"The agency granted accelerated assessment.":["a12",260100,12780],"list of questions":["a12",272880,7200],"We received the list of questions from the agency.":["a12",280080,14940],"clock stop":["a12",295020,5940],"During the clock stop we answer the questions.":["a12",300960,13320],"post-approval commitment":["a12",314280,8460],"A post-approval commitment requires a new study.":["a12",322740,15480],"deviation":["a12",338220,5400],"Every deviation must be documented.":["a12",343620,12600],"CAPA":["a12",356220,3780],"We opened a CAPA after the audit.":["a12",360000,10260],"root cause":["a12",370260,5760],"The team identified the root cause.":["a12",376020,10800],"inspection readiness":["a12",386820,7920],"Inspection readiness is a priority this year.":["a12",394740,14940],"validation":["a12",409680,5040],"The system validation is complete.":["a12",414720,10440],"change control":["a12",425160,6300],"Any change to the process needs change control.":["a12",431460,14940],"training record":["a12",446400,5220],"Your training record must be up to date.":["a12",451620,11880],"non-compliance":["a12",463500,7020],"Non-compliance can lead to fines.":["a12",470520,11520],"Hi, it's Daniel from Hospital Clínico. I'm sorry, but we need to move Thursday's monitoring visit. Dr. Ruiz will be away at a congress.":["s1",0,38269],"No problem, thanks for letting me know. Would early next week work for you?":["s1",38269,20520],"Okay. When can you do it?":["s1",58789,9720],"I can't assist on Thursday either.":["s1",68509,10800],"Tuesday morning would be great. Do you need Dr. Ruiz to be there the whole time?":["s1",79309,19722],"Not the whole time. Could he join us for about thirty minutes at the end to go over the findings?":["s1",99031,25920],"Yes, he must be there all the morning.":["s1",124951,11520],"He can be there or not, it's indifferent to me.":["s1",136471,13140],"Great. Also, a few queries are still open from last month. We've been really busy.":["s1",149611,22988],"I understand. Could you try to resolve them before Tuesday? I'm happy to go through any tricky ones with you.":["s1",172599,30060],"You have to close them before Tuesday.":["s1",202659,11340],"Don't worry, the queries are not important.":["s1",213999,13140],"Sure. I'll send you a calendar invite for Tuesday at nine.":["s1",227139,14890],"Perfect, thanks Daniel. I'll send you the visit agenda by Friday. Talk soon!":["s1",242029,25200],"Okay, bye.":["s1",267229,7020],"Perfect, I will send you the agenda the next Friday.":["s1",274249,15660],"Hi! How's the visit going so far?":["s2",0,10057],"Quite well, thank you. There's one thing I'd like to discuss with you, though: patient 014's consent form.":["s2",10057,31860],"Bad. There is a problem with a patient.":["s2",41917,12600],"Very well, everything is perfect.":["s2",54517,10620],"Oh? What's the issue?":["s2",65137,6139],"Patient 014 hasn't signed the latest version of the informed consent. He's still on version 2.0, and the current one is 3.0.":["s2",71276,41040],"Your team forgot to make the patient sign the new consent.":["s2",112316,14400],"The patient is not consented anymore, so we must withdraw him.":["s2",126716,20160],"I see. He's coming in next week for his visit. Is that soon enough?":["s2",146876,19069],"That should be fine, as long as he re-consents before any study procedures. We'll also need to report it as a protocol deviation.":["s2",165945,38700],"Yes, it's fine.":["s2",204645,8820],"Yes, he can sign it after the blood test.":["s2",213465,13320],"Understood. I'll ask the study nurse to prepare the new form.":["s2",226785,15282],"Thank you, I appreciate it. I'll include it in the follow-up letter so we can track it.":["s2",242067,25020],"Good. Don't forget it.":["s2",267087,8280],"Thank you, I will realize the follow-up letter.":["s2",275367,15300],"Hi, it's Mark. Patient 022 was admitted to hospital last night with severe chest pain.":["s3",0,28212],"Thanks for calling straight away, Mark. Is the patient stable now?":["s3",28212,18360],"Okay. Did you fill in the SAE form?":["s3",46572,13500],"Let's wait and see if he gets better before doing anything.":["s3",60072,16380],"Yes, he's stable. The doctors are still running tests.":["s3",76452,16326],"Good to hear. Since he was hospitalized, it qualifies as a serious adverse event, so it needs to be reported within 24 hours.":["s3",92778,38700],"Good. It is a serious event, report it.":["s3",131478,13320],"Good. We can wait for the test results before reporting it.":["s3",144798,16740],"Okay. Should we wait until we know if it's related to the study drug?":["s3",161538,17894],"No, please report it now with the information you have. The investigator can update the causality assessment in a follow-up report.":["s3",179432,37260],"No, report it now.":["s3",216692,8460],"Yes, if it's not related, we don't need to report it.":["s3",225152,16560],"Got it. I'll send it to the safety team this morning.":["s3",241712,11624],"Great, thanks Mark. Please copy me in, and let me know if you need help with the narrative.":["s3",253336,26820],"Okay, send me a copy too.":["s3",280156,11160],"Okay, put me in copy.":["s3",291316,10080],"Hi! I saw your email about the open queries. Sorry, it's been a crazy month here.":["s4",0,22857],"No worries, I know how busy you are. I just wanted to see how we can get them closed before the database lock on the 20th.":["s4",22857,33840],"It's okay. But you are late.":["s4",56697,9900],"No worries, the database lock can be moved.":["s4",66597,15480],"Most of them are about missing lab values. The rest, I'm not sure how to answer.":["s4",82077,21290],"That makes sense. Why don't we go through the tricky ones together on a quick call tomorrow?":["s4",103367,22680],"You must read the query text carefully.":["s4",126047,12600],"Just answer whatever, it doesn't matter.":["s4",138647,13500],"That would help a lot. Is 10 a.m. okay?":["s4",152147,9926],"10 a.m. works for me. In the meantime, could you upload the missing lab reports?":["s4",162073,24300],"Yes. Also, do the lab things.":["s4",186373,13140],"Yes, 10 a.m. is good. Meanwhile, realize the lab reports.":["s4",199513,21780],"Will do. Thanks for being so flexible.":["s4",221293,12147],"Happy to help. Speak tomorrow!":["s4",233440,9900],"Yes, I am very flexible, it's my job.":["s4",243340,14760],"Of nothing!":["s4",258100,4860],"Welcome! Please take a seat. Would you like a coffee before we start?":["s5",0,17241],"That would be lovely, thank you. And thanks for making time for this today.":["s5",17241,21420],"Yes, a coffee.":["s5",38661,6660],"Yes, please, I'm a bit constipated today.":["s5",45321,15480],"So, where would you like to begin?":["s5",60801,7706],"I thought we could start with a quick overview of the protocol, then go through the eligibility criteria and safety reporting.":["s5",68507,32760],"First the protocol, then the criteria, then safety.":["s5",101267,16380],"Let's begin for the protocol.":["s5",117647,9720],"One question: can we enroll patients who are already on a similar medication?":["s5",127367,21290],"Good question. They can be enrolled after a four-week washout period, as long as they meet all the other criteria.":["s5",148657,33660],"Yes, but they need to stop it before.":["s5",182317,12060],"Yes, no problem, they can continue with it.":["s5",194377,12960],"Perfect. And who should we contact if we have questions after today?":["s5",207337,16718],"You can always reach me by email or phone. For urgent safety issues, please use the 24-hour hotline in your site file.":["s5",224055,36720],"Me. Write me.":["s5",260775,7740],"You can call to my mobile whenever.":["s5",268515,10620],"Hi, quick heads-up: the IMP fridge hit 11 degrees over the weekend. It's back to normal now.":["s6",0,30433],"Thanks for flagging it. Could you put the affected kits in quarantine until we hear back from the sponsor?":["s6",30433,27720],"Okay, good that it's normal now.":["s6",58153,13680],"No problem, you can keep dispensing the kits.":["s6",71833,14580],"Sure. What information do you need from me?":["s6",86413,10841],"The temperature log, how long it was out of range, and the batch numbers of the affected kits.":["s6",97254,25740],"All the information you have.":["s6",122994,10440],"Only the minimum temperature.":["s6",133434,8460],"I'll send everything today. Do we need to do anything else?":["s6",141894,12669],"Please document it on the temperature excursion form. I'll submit it to the sponsor and let you know as soon as I hear back.":["s6",154563,31860],"Document it.":["s6",186423,4860],"Nothing, we can forget about it.":["s6",191283,10440],"Great, thanks.":["s6",201723,5486],"Thank you for catching it so quickly, Carlos. Have a good day!":["s6",207209,19980],"Bye.":["s6",227189,3780],"Thanks, eventually it was not a big problem.":["s6",230969,14220],"So, how are your sites doing this week?":["s7",0,11755],"Mostly on track. Two sites are recruiting well, but Hospital Norte is behind on enrollment.":["s7",11755,25560],"Good, good. Everything is fine, more or less.":["s7",37315,17460],"Actually, all the sites are perfect.":["s7",54775,12780],"What's going on at Hospital Norte?":["s7",67555,9012],"The coordinator is on leave, and they've had five screening failures out of eight patients.":["s7",76567,25380],"They have problems with patients.":["s7",101947,9720],"The coordinator is in holidays and the patients fail.":["s7",111667,14220],"Do you have a plan to get them back on track?":["s7",125887,10971],"Yes. I've suggested a pre-screening log, and I'd like to set up a call with the PI to review the eligibility criteria.":["s7",136858,35100],"I will see what I can do.":["s7",171958,9540],"No, it's not my responsibility.":["s7",181498,12240],"Sounds good. Keep me posted.":["s7",193738,8882],"Will do. I'll send you a quick update after the call with the PI.":["s7",202620,18900],"Okay, I will inform you.":["s7",221520,10260],"Okay, I'll post you.":["s7",231780,10440],"Hi, you must be the new CRA! I'm Ben, I work on the oncology team.":["s8",0,22335],"Hi Ben, nice to meet you! Yes, I just started today. I'll be working on the cardiovascular studies.":["s8",22335,32220],"Yes. Hello.":["s8",54555,7560],"Hi Ben, I am the new. Encanted.":["s8",62115,13140],"Welcome aboard! Where were you working before?":["s8",75255,10579],"I was a pharmacist, so this is my first role in clinical research. I'm really excited about it.":["s8",85834,28080],"In a pharmacy, before.":["s8",113914,8280],"I was working in a drugstore of drugs.":["s8",122194,11340],"That's a great background for this job. Has anyone shown you around yet?":["s8",133534,17894],"Not yet, actually. I'd really appreciate it if you could show me where everything is.":["s8",151428,25560],"No. Show me.":["s8",176988,6300],"Not yet. Can you realize a tour?":["s8",183288,12060],"Of course! And if you need anything, just ping me on Teams.":["s8",195348,16588],"Thanks, Ben, that's really kind. I'm sure I'll have lots of questions!":["s8",211936,23400],"Okay, I will ping.":["s8",235336,7200],"Thanks, I will molest you a lot.":["s8",242536,10080]};

const SCENES=[{"id":"s1","title":"Reprogramar una visita","sub":"Llamada con el coordinador del centro","who":"Daniel, study coordinator","ctx":"Daniel, coordinador del estudio en el Hospital Clínico, te llama dos días antes de tu visita de monitorización.","turns":[{"them":"Hi, it's Daniel from Hospital Clínico. I'm sorry, but we need to move Thursday's monitoring visit. Dr. Ruiz will be away at a congress.","es":"Hola, soy Daniel del Hospital Clínico. Lo siento, pero tenemos que mover la visita de monitorización del jueves. El Dr. Ruiz estará fuera en un congreso.","o":[{"t":"No problem, thanks for letting me know. Would early next week work for you?","q":2,"fb":"Natural y profesional: agradeces el aviso y propones una alternativa concreta."},{"t":"Okay. When can you do it?","q":1,"fb":"Correcto, pero suena seco. Una fórmula como «thanks for letting me know» suaviza mucho el tono."},{"t":"I can't assist on Thursday either.","q":0,"fb":"Falso amigo: «assist» significa ayudar. Asistir a algo se dice «attend». Además, son ellos quienes no pueden el jueves."}]},{"them":"Tuesday morning would be great. Do you need Dr. Ruiz to be there the whole time?","es":"El martes por la mañana sería perfecto. ¿Necesitas que el Dr. Ruiz esté todo el rato?","o":[{"t":"Not the whole time. Could he join us for about thirty minutes at the end to go over the findings?","q":2,"fb":"Aclaras lo que necesitas y propones un momento concreto. «Go over» (repasar) es muy habitual."},{"t":"Yes, he must be there all the morning.","q":1,"fb":"Error gramatical: se dice «all morning» o «the whole morning». Y pedir toda la mañana a un investigador principal suele ser poco realista."},{"t":"He can be there or not, it's indifferent to me.","q":0,"fb":"«It's indifferent to me» es un calco del español y suena raro, incluso descortés. Se diría «it's not essential» o «it's up to him»."}]},{"them":"Great. Also, a few queries are still open from last month. We've been really busy.","es":"Genial. Además, todavía hay algunas queries abiertas del mes pasado. Hemos estado muy liados.","o":[{"t":"I understand. Could you try to resolve them before Tuesday? I'm happy to go through any tricky ones with you.","q":2,"fb":"Empática y concreta: reconoces su carga de trabajo, pones un plazo y ofreces ayuda."},{"t":"You have to close them before Tuesday.","q":1,"fb":"Gramaticalmente bien, pero suena a orden. Con los centros se suele suavizar: «Could you try to…?»."},{"t":"Don't worry, the queries are not important.","q":0,"fb":"Inexacto y arriesgado: las queries abiertas importan, sobre todo antes del cierre de la base de datos."}]},{"them":"Sure. I'll send you a calendar invite for Tuesday at nine.","es":"Claro. Te envío una invitación de calendario para el martes a las nueve.","o":[{"t":"Perfect, thanks Daniel. I'll send you the visit agenda by Friday. Talk soon!","q":2,"fb":"Cierras con un siguiente paso claro (la agenda) y un tono cercano."},{"t":"Okay, bye.","q":1,"fb":"Correcto pero abrupto. Un cierre con agradecimiento y un siguiente paso deja mejor impresión."},{"t":"Perfect, I will send you the agenda the next Friday.","q":0,"fb":"«The next Friday» no se usa así. Se dice «by Friday» (antes del viernes) o «this Friday»."}]}]},{"id":"s2","title":"Un consentimiento sin firmar","sub":"Hablar de un hallazgo con el investigador","who":"Dr. Ruiz, principal investigator","ctx":"Durante la verificación de datos fuente descubres que el paciente 014 no ha firmado la última versión del consentimiento informado. Lo comentas con el investigador principal.","turns":[{"them":"Hi! How's the visit going so far?","es":"¡Hola! ¿Qué tal va la visita hasta ahora?","o":[{"t":"Quite well, thank you. There's one thing I'd like to discuss with you, though: patient 014's consent form.","q":2,"fb":"Introduces el tema con tacto. El «though» final suaviza el paso a algo delicado."},{"t":"Bad. There is a problem with a patient.","q":1,"fb":"Demasiado directo y alarmista: puede poner al investigador a la defensiva."},{"t":"Very well, everything is perfect.","q":0,"fb":"No es honesto: hay un hallazgo que debes comunicar. En monitorización, la transparencia es clave."}]},{"them":"Oh? What's the issue?","es":"¿Ah, sí? ¿Cuál es el problema?","o":[{"t":"Patient 014 hasn't signed the latest version of the informed consent. He's still on version 2.0, and the current one is 3.0.","q":2,"fb":"Clara y precisa: dices qué pasa y con qué versión, sin culpar a nadie."},{"t":"Your team forgot to make the patient sign the new consent.","q":1,"fb":"La información es correcta, pero culpar al equipo («your team forgot») genera tensión innecesaria."},{"t":"The patient is not consented anymore, so we must withdraw him.","q":0,"fb":"Incorrecto: no hay que retirarlo, hay que volver a consentirle con la versión vigente cuanto antes."}]},{"them":"I see. He's coming in next week for his visit. Is that soon enough?","es":"Entiendo. Viene la semana que viene a su visita. ¿Es suficiente?","o":[{"t":"That should be fine, as long as he re-consents before any study procedures. We'll also need to report it as a protocol deviation.","q":2,"fb":"Das la condición clave (reconsentir antes de cualquier procedimiento) y el siguiente paso regulatorio."},{"t":"Yes, it's fine.","q":1,"fb":"Se queda corto: falta la condición de firmar antes de cualquier procedimiento y la notificación de la desviación."},{"t":"Yes, he can sign it after the blood test.","q":0,"fb":"Error importante: el consentimiento se firma antes de cualquier procedimiento del estudio, analítica incluida."}]},{"them":"Understood. I'll ask the study nurse to prepare the new form.","es":"Entendido. Le pediré a la enfermera del estudio que prepare el nuevo formulario.","o":[{"t":"Thank you, I appreciate it. I'll include it in the follow-up letter so we can track it.","q":2,"fb":"Agradeces y dejas constancia por escrito: así se hace el seguimiento de los hallazgos."},{"t":"Good. Don't forget it.","q":1,"fb":"«Don't forget it» suena condescendiente con un investigador principal."},{"t":"Thank you, I will realize the follow-up letter.","q":0,"fb":"Falso amigo: «realize» significa darse cuenta. Para redactar se dice «write» o «prepare»."}]}]},{"id":"s3","title":"El centro notifica un SAE","sub":"Un paciente ha sido hospitalizado","who":"Mark, study nurse","ctx":"Mark, enfermero del estudio, te llama a primera hora: un paciente ingresó anoche en el hospital.","turns":[{"them":"Hi, it's Mark. Patient 022 was admitted to hospital last night with severe chest pain.","es":"Hola, soy Mark. El paciente 022 ingresó anoche en el hospital con un dolor torácico intenso.","o":[{"t":"Thanks for calling straight away, Mark. Is the patient stable now?","q":2,"fb":"Lo primero es el paciente: agradeces la rapidez y preguntas por su estado."},{"t":"Okay. Did you fill in the SAE form?","q":1,"fb":"Es una pregunta necesaria, pero empezar por el formulario antes que por el paciente suena frío."},{"t":"Let's wait and see if he gets better before doing anything.","q":0,"fb":"Incorrecto: un ingreso hospitalario hay que gestionarlo ya, no se espera a ver cómo evoluciona."}]},{"them":"Yes, he's stable. The doctors are still running tests.","es":"Sí, está estable. Los médicos todavía le están haciendo pruebas.","o":[{"t":"Good to hear. Since he was hospitalized, it qualifies as a serious adverse event, so it needs to be reported within 24 hours.","q":2,"fb":"Explicas por qué es grave (la hospitalización) y el plazo de notificación."},{"t":"Good. It is a serious event, report it.","q":1,"fb":"Correcto en el fondo, pero muy seco y sin explicar el plazo."},{"t":"Good. We can wait for the test results before reporting it.","q":0,"fb":"Incorrecto: el plazo de 24 horas empieza cuando el centro conoce el caso. No se espera a los resultados."}]},{"them":"Okay. Should we wait until we know if it's related to the study drug?","es":"Vale. ¿Esperamos a saber si está relacionado con el fármaco del estudio?","o":[{"t":"No, please report it now with the information you have. The investigator can update the causality assessment in a follow-up report.","q":2,"fb":"Exacto: se notifica con la información disponible y la causalidad se actualiza en el seguimiento."},{"t":"No, report it now.","q":1,"fb":"Correcto, pero no explicas cómo se gestionará la causalidad pendiente."},{"t":"Yes, if it's not related, we don't need to report it.","q":0,"fb":"Incorrecto: un acontecimiento adverso grave se notifica sea cual sea la causalidad."}]},{"them":"Got it. I'll send it to the safety team this morning.","es":"Entendido. Lo envío al equipo de seguridad esta mañana.","o":[{"t":"Great, thanks Mark. Please copy me in, and let me know if you need help with the narrative.","q":2,"fb":"«Copy me in» (ponme en copia) es muy habitual en emails de trabajo. Y ofreces ayuda concreta."},{"t":"Okay, send me a copy too.","q":1,"fb":"Bien, aunque un «please» y un agradecimiento hacen el mensaje más amable."},{"t":"Okay, put me in copy.","q":0,"fb":"Calco de «ponme en copia». En inglés se dice «copy me in» o «cc me»."}]}]},{"id":"s4","title":"Queries antes del cierre","sub":"Un centro con retraso en los datos","who":"Tom, study coordinator","ctx":"Faltan dos semanas para el cierre de la base de datos y el centro tiene 18 queries abiertas. Llamas a Tom, el coordinador.","turns":[{"them":"Hi! I saw your email about the open queries. Sorry, it's been a crazy month here.","es":"¡Hola! He visto tu email sobre las queries abiertas. Perdona, ha sido un mes de locos aquí.","o":[{"t":"No worries, I know how busy you are. I just wanted to see how we can get them closed before the database lock on the 20th.","q":2,"fb":"Muestras empatía y vas al objetivo con una fecha concreta."},{"t":"It's okay. But you are late.","q":1,"fb":"«You are late» suena a reproche. Mejor centrarse en la solución."},{"t":"No worries, the database lock can be moved.","q":0,"fb":"Falso y peligroso: el cierre de la base de datos no depende de un centro y no se suele mover."}]},{"them":"Most of them are about missing lab values. The rest, I'm not sure how to answer.","es":"La mayoría son de valores de laboratorio que faltan. Las demás no sé muy bien cómo responderlas.","o":[{"t":"That makes sense. Why don't we go through the tricky ones together on a quick call tomorrow?","q":2,"fb":"«Why don't we…?» es una forma natural de proponer algo, y ofreces una solución práctica."},{"t":"You must read the query text carefully.","q":1,"fb":"Suena condescendiente y no ayuda de verdad."},{"t":"Just answer whatever, it doesn't matter.","q":0,"fb":"Muy grave: las respuestas deben reflejar los documentos fuente con exactitud."}]},{"them":"That would help a lot. Is 10 a.m. okay?","es":"Eso me ayudaría mucho. ¿Te va bien a las 10?","o":[{"t":"10 a.m. works for me. In the meantime, could you upload the missing lab reports?","q":2,"fb":"Confirmas y aprovechas para pedir algo concreto. «In the meantime» significa mientras tanto."},{"t":"Yes. Also, do the lab things.","q":1,"fb":"Se entiende, pero «lab things» es demasiado vago e informal."},{"t":"Yes, 10 a.m. is good. Meanwhile, realize the lab reports.","q":0,"fb":"Falso amigo: «realize» no significa realizar. Aquí sería «upload» o «add»."}]},{"them":"Will do. Thanks for being so flexible.","es":"Hecho. Gracias por ser tan flexible.","o":[{"t":"Happy to help. Speak tomorrow!","q":2,"fb":"Cierre corto, natural y cordial."},{"t":"Yes, I am very flexible, it's my job.","q":1,"fb":"Correcto, pero suena extraño. Basta con aceptar el agradecimiento."},{"t":"Of nothing!","q":0,"fb":"Calco de «de nada». En inglés se dice «You're welcome», «No problem» o «Happy to help»."}]}]},{"id":"s5","title":"La visita de inicio","sub":"Presentar el estudio al equipo del centro","who":"Dr. Patel, principal investigator","ctx":"Llegas al centro para la visita de inicio (SIV). El investigador principal y su equipo te esperan en la sala de reuniones.","turns":[{"them":"Welcome! Please take a seat. Would you like a coffee before we start?","es":"¡Bienvenida! Siéntate, por favor. ¿Quieres un café antes de empezar?","o":[{"t":"That would be lovely, thank you. And thanks for making time for this today.","q":2,"fb":"Aceptas con naturalidad y agradeces su tiempo: buen comienzo."},{"t":"Yes, a coffee.","q":1,"fb":"Se entiende, pero sin «please» ni «thank you» suena brusco."},{"t":"Yes, please, I'm a bit constipated today.","q":0,"fb":"Falso amigo: «constipated» significa estreñida, no resfriada. Para un resfriado se dice «I have a cold»."}]},{"them":"So, where would you like to begin?","es":"Bueno, ¿por dónde quieres empezar?","o":[{"t":"I thought we could start with a quick overview of the protocol, then go through the eligibility criteria and safety reporting.","q":2,"fb":"Presentas una agenda clara. «I thought we could…» es una forma amable de proponer."},{"t":"First the protocol, then the criteria, then safety.","q":1,"fb":"Correcto pero telegráfico: suena a lista más que a conversación."},{"t":"Let's begin for the protocol.","q":0,"fb":"Preposición incorrecta: se dice «begin with» o «start with»."}]},{"them":"One question: can we enroll patients who are already on a similar medication?","es":"Una pregunta: ¿podemos incluir pacientes que ya toman una medicación parecida?","o":[{"t":"Good question. They can be enrolled after a four-week washout period, as long as they meet all the other criteria.","q":2,"fb":"Respuesta precisa, con el término técnico correcto («washout period») y la condición."},{"t":"Yes, but they need to stop it before.","q":1,"fb":"Va en la buena línea, pero es impreciso: ¿cuánto tiempo antes? Falta el periodo de lavado."},{"t":"Yes, no problem, they can continue with it.","q":0,"fb":"Incorrecto según el protocolo, que exige un periodo de lavado. Responder sin comprobarlo es arriesgado."}]},{"them":"Perfect. And who should we contact if we have questions after today?","es":"Perfecto. ¿Y a quién contactamos si tenemos dudas después de hoy?","o":[{"t":"You can always reach me by email or phone. For urgent safety issues, please use the 24-hour hotline in your site file.","q":2,"fb":"Das un canal general y uno urgente: justo lo que necesita el centro."},{"t":"Me. Write me.","q":1,"fb":"Se entiende, pero muy cortante. «Feel free to email me» sería más natural."},{"t":"You can call to my mobile whenever.","q":0,"fb":"Error de preposición: se dice «call me» o «call my mobile», sin «to». Y conviene dar el canal de urgencias."}]}]},{"id":"s6","title":"Una desviación de temperatura","sub":"La nevera del medicamento se calentó","who":"Carlos, hospital pharmacist","ctx":"Carlos, el farmacéutico del hospital, te avisa de que la nevera del medicamento en investigación marcó 11 °C durante el fin de semana.","turns":[{"them":"Hi, quick heads-up: the IMP fridge hit 11 degrees over the weekend. It's back to normal now.","es":"Hola, un aviso rápido: la nevera del medicamento en investigación llegó a 11 grados el fin de semana. Ya ha vuelto a la normalidad.","o":[{"t":"Thanks for flagging it. Could you put the affected kits in quarantine until we hear back from the sponsor?","q":2,"fb":"«Flag» (señalar un problema) es muy habitual. Y pides la acción correcta: cuarentena."},{"t":"Okay, good that it's normal now.","q":1,"fb":"Te quedas corta: aunque ya esté bien, la excursión hay que gestionarla."},{"t":"No problem, you can keep dispensing the kits.","q":0,"fb":"Incorrecto: los kits afectados no se dispensan hasta que el promotor confirme que son aptos."}]},{"them":"Sure. What information do you need from me?","es":"Claro. ¿Qué información necesitas?","o":[{"t":"The temperature log, how long it was out of range, and the batch numbers of the affected kits.","q":2,"fb":"Pides exactamente lo necesario para evaluar la excursión."},{"t":"All the information you have.","q":1,"fb":"Demasiado vago: es mejor concretar qué datos necesitas."},{"t":"Only the minimum temperature.","q":0,"fb":"Insuficiente: lo importante es la temperatura máxima, la duración y los lotes afectados."}]},{"them":"I'll send everything today. Do we need to do anything else?","es":"Te lo mando todo hoy. ¿Tenemos que hacer algo más?","o":[{"t":"Please document it on the temperature excursion form. I'll submit it to the sponsor and let you know as soon as I hear back.","q":2,"fb":"Repartes las tareas con claridad y te comprometes a informar."},{"t":"Document it.","q":1,"fb":"Correcto pero escueto: no dices dónde ni qué harás tú."},{"t":"Nothing, we can forget about it.","q":0,"fb":"Incorrecto: toda excursión de temperatura debe documentarse y evaluarse."}]},{"them":"Great, thanks.","es":"Genial, gracias.","o":[{"t":"Thank you for catching it so quickly, Carlos. Have a good day!","q":2,"fb":"Reconoces su trabajo, y eso refuerza la relación con el centro."},{"t":"Bye.","q":1,"fb":"Correcto, pero frío."},{"t":"Thanks, eventually it was not a big problem.","q":0,"fb":"Falso amigo: «eventually» significa al final o con el tiempo. Además, todavía no sabes si es un problema."}]}]},{"id":"s7","title":"Informar a tu manager","sub":"Reunión semanal sobre tus centros","who":"James, clinical trial manager","ctx":"Reunión semanal con James, tu clinical trial manager. Quiere saber cómo van tus centros.","turns":[{"them":"So, how are your sites doing this week?","es":"Bueno, ¿cómo van tus centros esta semana?","o":[{"t":"Mostly on track. Two sites are recruiting well, but Hospital Norte is behind on enrollment.","q":2,"fb":"Resumen claro: primero lo bueno y después el riesgo, con términos precisos."},{"t":"Good, good. Everything is fine, more or less.","q":1,"fb":"Vago: un manager necesita datos y riesgos concretos."},{"t":"Actually, all the sites are perfect.","q":0,"fb":"«Actually» significa en realidad, no actualmente. Y decir que todo va perfecto cuando un centro va con retraso no es honesto."}]},{"them":"What's going on at Hospital Norte?","es":"¿Qué está pasando en el Hospital Norte?","o":[{"t":"The coordinator is on leave, and they've had five screening failures out of eight patients.","q":2,"fb":"Explicas la causa y das cifras con el término correcto («screening failures»)."},{"t":"They have problems with patients.","q":1,"fb":"Demasiado genérico: no explicas la causa ni das datos."},{"t":"The coordinator is in holidays and the patients fail.","q":0,"fb":"Varios errores: se dice «on holiday» u «on leave», y «the patients fail» no transmite que no cumplen los criterios."}]},{"them":"Do you have a plan to get them back on track?","es":"¿Tienes un plan para que vuelvan a ir según lo previsto?","o":[{"t":"Yes. I've suggested a pre-screening log, and I'd like to set up a call with the PI to review the eligibility criteria.","q":2,"fb":"Propones acciones concretas en primera persona: transmites iniciativa."},{"t":"I will see what I can do.","q":1,"fb":"Suena a que no tienes plan. Mejor proponer algo concreto, aunque sea pequeño."},{"t":"No, it's not my responsibility.","q":0,"fb":"Mala respuesta profesional: hacer seguimiento del reclutamiento es parte del trabajo de una CRA."}]},{"them":"Sounds good. Keep me posted.","es":"Me parece bien. Mantenme informado.","o":[{"t":"Will do. I'll send you a quick update after the call with the PI.","q":2,"fb":"«Will do» es una respuesta muy natural, y concretas cuándo informarás."},{"t":"Okay, I will inform you.","q":1,"fb":"Correcto, aunque «inform» suena formal. En una conversación se dice «I'll keep you updated» o «Will do»."},{"t":"Okay, I'll post you.","q":0,"fb":"«Keep me posted» es una expresión fija (mantenme informado). No se responde con «I'll post you»."}]}]},{"id":"s8","title":"Tu primer día en la oficina","sub":"Presentarte a un compañero","who":"Ben, colleague","ctx":"Primer día en la oficina. Un compañero de tu equipo se acerca a saludarte.","turns":[{"them":"Hi, you must be the new CRA! I'm Ben, I work on the oncology team.","es":"Hola, ¡tú debes de ser la nueva CRA! Soy Ben, trabajo en el equipo de oncología.","o":[{"t":"Hi Ben, nice to meet you! Yes, I just started today. I'll be working on the cardiovascular studies.","q":2,"fb":"Presentación completa y natural: saludas, confirmas y das contexto."},{"t":"Yes. Hello.","q":1,"fb":"Correcto, pero pierdes la oportunidad de presentarte."},{"t":"Hi Ben, I am the new. Encanted.","q":0,"fb":"«I am the new» está incompleto («I'm new here») y «Encanted» es un calco. Se dice «Nice to meet you»."}]},{"them":"Welcome aboard! Where were you working before?","es":"¡Bienvenida! ¿Dónde trabajabas antes?","o":[{"t":"I was a pharmacist, so this is my first role in clinical research. I'm really excited about it.","q":2,"fb":"Explicas tu trayectoria en una frase y transmites motivación."},{"t":"In a pharmacy, before.","q":1,"fb":"Se entiende, pero el orden y la brevedad suenan poco naturales."},{"t":"I was working in a drugstore of drugs.","q":0,"fb":"Redundante y confuso. Se diría «I worked as a pharmacist» o «in a community pharmacy»."}]},{"them":"That's a great background for this job. Has anyone shown you around yet?","es":"Es una buena base para este trabajo. ¿Ya te ha enseñado alguien la oficina?","o":[{"t":"Not yet, actually. I'd really appreciate it if you could show me where everything is.","q":2,"fb":"«Actually» bien usado (en realidad). «I'd really appreciate it if…» es una petición muy educada."},{"t":"No. Show me.","q":1,"fb":"Un imperativo directo suena brusco con alguien a quien acabas de conocer."},{"t":"Not yet. Can you realize a tour?","q":0,"fb":"Falso amigo: «realize» es darse cuenta. Se diría «show me around» o «give me a tour»."}]},{"them":"Of course! And if you need anything, just ping me on Teams.","es":"¡Claro! Y si necesitas algo, escríbeme por Teams.","o":[{"t":"Thanks, Ben, that's really kind. I'm sure I'll have lots of questions!","q":2,"fb":"Agradeces y aceptas la ayuda con naturalidad. «Ping me» significa escríbeme un mensaje."},{"t":"Okay, I will ping.","q":1,"fb":"Le falta el complemento («I'll ping you») y un agradecimiento."},{"t":"Thanks, I will molest you a lot.","q":0,"fb":"¡Cuidado! «Molest» significa abusar sexualmente, no molestar. Se diría «I'll probably bother you a lot» (en broma)."}]}]}];

 if(m.a&&m.b){if(m.a===m.b){m.gone.add(m.a);bump(W[m.a],true);m.a=m.b=null;renderEx(false);if(m.gone.size===EX.ex.ws.length){const ok=m.errs<=1;EX.checked=true;if(ok){EX.ex.retry?L.retryOk++:L.first++}else{L.wrong++;if(!EX.ex.retry)L.q.push(Object.assign({},EX.ex,{retry:true,left:null,right:null}))}
   const lf=document.querySelector('.lfoot');lf.outerHTML=`<div class="lfoot" id="foot"><div class="wrap"><div class="fb" id="fb"></div><button class="btn" id="cbtn">Continuar</button></div></div>`;feedback(ok,false)}}
  else{m.errs++;const ia=m.a,ib=m.b;bump(W[ia],false);m.a=m.b=null;renderEx(false);document.querySelectorAll(`.mt[data-id="${ia}"][data-act="ma"],.mt[data-id="${ib}"][data-act="mb"]`).forEach(x=>x.classList.add('err'))}}
 else renderEx(false)}

// app-like: block pinch-zoom (iOS gesture events + multi-touch moves); double-tap zoom is off via touch-action
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
